<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Africa-Building</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --ink:#14213D; --blue:#1C3D6E; --sun:#E9A93B; --line:#C9D0DE; --card:#FFFFFF; --muted:#5E6872;
  --hfont:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif; --bfont:"Public Sans",system-ui,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0F1A33;--ink:#EEF1F8;--blue:#8FB0FF;--sun:#E9A93B;--line:#2D3C63;--card:#16264A;--muted:#AAB6D3;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#0F1A33;--ink:#EEF1F8;--blue:#8FB0FF;--sun:#E9A93B;--line:#2D3C63;--card:#16264A;--muted:#AAB6D3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--bfont)}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;gap:16px;flex-wrap:wrap}
.logo{font:800 22px var(--hfont);letter-spacing:-.01em;text-decoration:none}
.logo img{display:block;height:84px;width:auto;border-radius:6px;background:#fff}
nav{display:flex;gap:22px;font-weight:500;font-size:15px}
nav a{text-decoration:none;border-bottom:2px solid transparent}
nav a:hover{border-color:var(--sun)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;padding:36px 0 70px}
h1{font:800 clamp(38px,6vw,68px)/1 var(--hfont);letter-spacing:-.025em;margin:0 0 22px}
.lead{font-size:19px;color:var(--muted);max-width:30em;margin:0 0 28px}
.btn{display:inline-block;background:var(--sun);color:#14213D;font-weight:600;padding:14px 24px;border-radius:4px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-left:10px}
.plan{background:var(--card);border:1px solid var(--line);padding:14px;border-radius:4px}
.plan svg{width:100%;height:auto;display:block}
.plan .w{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.6s ease-out forwards}
.plan .t{fill:none;stroke:var(--blue);stroke-width:1.2;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2.6s .5s ease-out forwards}
.plan .c{fill:var(--ink)}
.plan .d{stroke:var(--muted);stroke-width:1;fill:none}
.plan text{font:500 11px var(--bfont);fill:var(--muted)}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.plan .w,.plan .t{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
section{padding:64px 0;border-top:1px solid var(--line)}
h2{font:700 clamp(28px,4vw,40px)/1.1 var(--hfont);letter-spacing:-.015em;margin:0 0 14px}
.sub{color:var(--muted);max-width:34em;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.svc{border-left:4px solid var(--sun);padding:4px 0 4px 18px}
.svc h3{font:700 21px var(--hfont);margin:0 0 6px}
.svc p{margin:0;color:var(--muted);font-size:16px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.proj .pic{height:150px;background:
  repeating-linear-gradient(90deg,transparent 0 39px,var(--line) 39px 40px),
  repeating-linear-gradient(0deg,transparent 0 39px,var(--line) 39px 40px);display:flex;align-items:flex-end;padding:12px}
.proj .pic b{background:var(--blue);color:#fff;font:600 13px var(--bfont);padding:4px 10px;border-radius:2px}
:root[data-theme="dark"] .proj .pic b{color:#0F1A33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .proj .pic b{color:#0F1A33}}
.proj div.t{padding:16px 18px 20px}
.proj h3{font:700 20px var(--hfont);margin:0 0 4px}
.proj p{margin:0;color:var(--muted);font-size:15px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-top:48px}
ol.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:36px;height:36px;border-radius:50%;background:var(--blue);color:var(--paper);font:700 17px/36px var(--hfont);text-align:center}
ol.steps li::after{content:"";position:absolute;top:17px;left:46px;right:-12px;height:2px;background:var(--line)}
ol.steps li:last-child::after{display:none}
ol.steps h3{font:700 19px var(--hfont);margin:0 0 4px}
ol.steps p{margin:0;color:var(--muted);font-size:15px}
.contact{background:var(--blue);color:#fff;border-radius:6px;padding:44px 32px;display:grid;grid-template-columns:1fr 1fr;gap:32px}
:root[data-theme="dark"] .contact{color:#0F1A33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact{color:#0F1A33}}
.contact h2{margin-bottom:10px}
.contact p{margin:0 0 8px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:12px}
input,textarea{width:100%;margin-top:4px;padding:12px;border:0;border-radius:4px;font:inherit;background:#fff;color:#14213D}
textarea{min-height:90px;resize:vertical}
.contact button{background:var(--sun);color:#14213D;font:600 17px var(--bfont);border:0;padding:14px 24px;border-radius:4px;cursor:pointer}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
@media (max-width:760px){.hero,.contact{grid-template-columns:1fr}.btn.alt{margin:10px 0 0}ol.steps li::after{display:none}}

.top{display:flex;gap:18px;align-items:center}
.lang{background:transparent;border:2px solid var(--ink);color:var(--ink);font:600 14px var(--bfont);padding:6px 12px;border-radius:4px;cursor:pointer}
.btn.wa,.contact a.wa{background:#25D366;color:#0B3D1F;font-weight:600;display:inline-flex;gap:8px;align-items:center;padding:14px 24px;border-radius:4px;text-decoration:none;border:0}
.btn.wa{margin-left:10px}
.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20}
.wa-float svg,.wa svg{width:28px;height:28px;fill:#fff}
.btn.wa svg,.contact a.wa svg{fill:#0B3D1F;width:22px;height:22px}
.contact .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
@media (max-width:760px){.btn.wa{margin:10px 0 0}}
</style>
</head>
